# ALPHA (preview) game server — the deployment the `alpha` branch's Vercel build talks to.
#
# A SEPARATE APP rather than another region of the production one, because the two things
# that make a preview useful are exactly the two things a shared app cannot give it:
#
#   · its OWN DATABASE. Standing, dodge penalties, reports, playtime and ranked all exist by
#     writing to Postgres. On the shared server those writes are suppressed for alpha builds
#     (they would land in production boards), so the features could not actually be tested —
#     they silently no-opped. Here `SERVER_CHANNEL=alpha` lets them persist, into the alpha
#     database and nowhere else.
#   · its OWN CODE. `src/sim` differs between branches; one app serving both means every
#     protocol change has to stay backward-compatible with whatever main is running. It still
#     should — see the deploy notes — but the preview no longer has to prove it on production.
#
# DIFFERENCES FROM fly.toml, all deliberate and all about cost:
#   · ONE region, ord (US Central; owner, 2026-11-02, from iad). The multi-region layout exists
#     to put a match near its players; a preview has a handful of testers, and the matchmaker
#     has to live somewhere anyway. Moving it is four values that must agree: `primary_region`
#     and `MATCHMAKER_REGION` here, `TARGET_REGION`/`primary_region` in router/fly.alpha.toml,
#     and the `region` in the alpha Vercel project's VITE_GAME_SERVERS (the client sends it as
#     a `?region=` hint, and a hint naming a region with no machine is replayed nowhere).
#     The database and Neon Auth stay in us-east-1, so each query from ord is ~20 ms further.
#   · min_machines_running = 0. Production keeps the matchmaker warm because a cold boot in
#     front of a real player is a bad first impression. A preview can eat the ~7s wake.
#   · shared-cpu-4x. shared-cpu-2x throttled on 09-21 (3h) and 09-25 (1h), so the capacity
#     checkup moved it up a step; it costs money only while the machine is started.
#
# Deploy with:  ./scripts/fly-deploy.sh --alpha
# NEVER a bare `fly deploy` here either — it would pick up fly.toml and redeploy PRODUCTION.

app = 'dsim-alpha'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  # what makes this deployment persist alpha results to its own database (server/channel.ts).
  # NOT a secret — it changes behaviour, not access.
  SERVER_CHANNEL = 'alpha'
  # accept self-hosted (LAN) matches filed by their host — server/lanUploads.ts. Set HERE and
  # deliberately NOT in fly.toml: LAN is finished but is being held back from production for
  # now, and the gate fails closed, so the prod app simply does not mount `/api/lan`. The
  # CLIENT half is VITE_LAN_ENABLED on the matching Vercel project; a LAN environment needs
  # both, and preview is the only one that has either.
  LAN_UPLOADS = '1'
  # introduce two browsers to each other so one can host the room in a TAB
  # (docs/lan-webrtc.md, server/lanUploads.ts `LAN_SIGNALLING`). A THIRD door, and it needs
  # its own switch: LAN_UPLOADS closes the route by which a LAN match reaches production
  # DATA, and the rendezvous touches no data at all — so that flag does not cover it, and an
  # ungated rendezvous would have opened tab hosting in production while LAN is held back.
  # Set here for the same reason as the line above, and deliberately NOT in fly.toml.
  LAN_SIGNALLING = '1'
  # multi-core rooms, as in fly.toml (docs/scaling-multicore.md): shared-cpu-4x gets three workers
  SIM_WORKERS = 'auto'
  # the ranked queue's `?mm=1` replay target and the competition runner's home (server/regions.ts).
  # It defaults to iad, which has no alpha machine since the move to ord.
  MATCHMAKER_REGION = 'ord'
  # one machine, so every routing hint is answered here rather than replayed to a region with no
  # machine (server/index.ts `SINGLE_REGION`): an old client's iad hint, a room code stamped iad
  SINGLE_REGION = '1'

[http_service]
  internal_port = 8080
  force_https = true
  # idle to zero: a preview is used in bursts, and the first connection wakes it
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
