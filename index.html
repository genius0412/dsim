<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- installable on phones (Add to Home Screen → standalone app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSIM" />
    <!-- keep in sync with --ds-bg (shell.css) and THEME_BG (src/theme.ts) -->
    <meta name="theme-color" content="#f9faf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20262c" media="(prefers-color-scheme: dark)" />

    <!--
      SEO + link previews. This file is ALL a crawler or a social scraper gets:
      the app is client-rendered, and the scrapers behind Discord / iMessage /
      Slack / X don't run JS at all. So the title, description, canonical and
      og:*/twitter:* tags below have to describe the HOMEPAGE on their own.

      `src/seo.ts` re-points title / description / canonical / og:url per route
      once React is up (for Googlebot, which does render). Keep the two in sync:
      the values here ARE the home-route values in that module.
    -->
    <title>DSIM presented by Offset Robotics</title>
    <meta
      name="description"
      content="An online driving simulator for FIRST Tech Challenge. Build a robot, drive DECODE, Chain Reaction or BIOBUZZ, and play solo or ranked."
    />
    <link rel="canonical" href="https://www.playdsim.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSIM" />
    <meta property="og:title" content="DSIM: Online FTC Driving Simulator" />
    <meta
      property="og:description"
      content="An online driving simulator for FIRST Tech Challenge. Build a robot, drive DECODE, Chain Reaction or BIOBUZZ, and play solo or ranked."
    />
    <meta property="og:url" content="https://www.playdsim.com/" />
    <!--
      absolute, and a real 1200x630 card: scrapers won't resolve a relative src.
      `public/og.png` is GENERATED by `npm run og` (scripts/og-image.cjs) and
      committed; it carries the presenting sponsor's mark, so the alt text names
      them too — a screen reader on a pasted link is one of the surfaces the
      placement was sold for. ⚠️ When the term lapses, re-run `npm run og` and
      drop the sponsor clause from both alt strings below; the card is a build
      artifact, so `SPONSOR.term` cannot take it down on its own.
    -->
    <meta property="og:image" content="https://www.playdsim.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="DSIM: online FTC driving simulator. Presented by Offset Robotics."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DSIM: Online FTC Driving Simulator" />
    <meta
      name="twitter:description"
      content="An online driving simulator for FIRST Tech Challenge. Build a robot, drive DECODE, Chain Reaction or BIOBUZZ, and play solo or ranked."
    />
    <meta name="twitter:image" content="https://www.playdsim.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="DSIM: online FTC driving simulator. Presented by Offset Robotics."
    />
    <!--
      Google AdSense site verification. This has to sit in the served HTML of EVERY
      page, which for a client-rendered SPA means here and only here: index.html is
      what Vercel returns for every route, so one tag covers the whole site.

      `data-dsim-adsense` is the dedupe key the runtime ad loader looks for
      (`src/ads/adsense.ts`, monetization branch) before injecting its own copy —
      without it a merged build would pull adsbygoogle.js twice.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7020325778340658"
      crossorigin="anonymous"
      data-dsim-adsense="1"
    ></script>

    <!--
      Stamp the theme BEFORE the stylesheet loads. React mounts after first paint, so
      reading the pref from src/ would guarantee a flash of the wrong theme. This must
      stay inline, dependency-free, and above the CSS. Mirrors src/theme.ts — CSS only
      ever sees the resolved 'light' | 'dark'.
    -->
    <script>
      (function () {
        var p = 'system';
        try {
          p = localStorage.getItem('decodesim.theme') || 'system';
        } catch (e) {}
        if (p !== 'light' && p !== 'dark') {
          p = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = p;
      })();
    </script>
    <!--
      THE BOOT SCREEN'S GROUND (`#seo-home` below, in its JS-on look). It takes the ground of the
      screen it hands over to, so its fade-out (`dismissBoot`, src/ui/screenFade.ts) changes what
      is on the page and not the colour of the page: the MENU STAGE (Home on a desktop, Play and
      its popups everywhere) is dark in both themes, every other screen is the themed shell.
      Mirrors `parseScreen` (src/ui/App.tsx) loosely: a miss costs a fade between two grounds.
    -->
    <script>
      (function () {
        var rest = location.pathname.replace(/^\/(decode|chain|biobuzz)(?=\/|$)/, '');
        var shell =
          /^\/(configure(?!\/match)|records|profile|replay|download|contributors|privacy|terms|donate|changelogs|account|admin|my-robot|leaderboard|stats|discord-lobbies|competitions\/[a-z0-9])/.test(rest);
        var play = /^\/(modes|match-setup|solo-setup|practice-setup|configure\/match|lobby|rooms|watch|duo-record|record|ranked|lan|competitions)/.test(rest);
        document.documentElement.dataset.boot = shell || (!play && innerWidth <= 720) ? 'shell' : 'stage';
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DSIM",
        "alternateName": "DSIM: Online FTC Driving Simulator",
        "url": "https://www.playdsim.com/",
        "description": "An online driving simulator for FIRST Tech Challenge. Build a robot, drive DECODE, Chain Reaction or BIOBUZZ, and play solo or ranked.",
        "inLanguage": "en",
        "publisher": { "@type": "Organization", "name": "DSIM", "url": "https://www.playdsim.com/" }
      }
    </script>

    <!--
      The static homepage below (#seo-home, beside #root) is what a NON-JS client
      sees: social scrapers, plain crawlers. It deliberately says the SAME things the
      rendered home menu says (`HomeMenu.tsx`), so the two can't read as cloaking.

      With JS on it is the BOOT SCREEN instead (`:root[data-boot]`, stamped above):
      the mark, the sponsor line and a loading bar, fixed over #root on the ground of
      the screen that follows. React mounts into #root underneath it and
      `dismissBoot` (src/ui/screenFade.ts) fades it off once that screen has painted,
      then removes it. Its menu, game links and footer are hidden there, not removed:
      it used to be the full pre-stage menu, inside #root, and a visitor saw an old
      home page (DECODE picked, links that reload the page) swapped for the real one
      in a single frame — for 7 s on a Slow 4G line (measured 2026-11-02).

      It is also where the site's only crawlable <a href> links live: every
      in-app destination is a <button onClick> behind the router, so without
      these there is nothing for a crawler to follow off the homepage.

      Styles are self-contained (own palette vars, system fonts) on purpose —
      shell.css and the webfonts arrive with the bundle, i.e. after this markup
      has already had to stand on its own.
    -->
    <style>
      #seo-home {
        --sh-bg: #f9faf7;
        --sh-panel: #ffffff;
        --sh-ink: #191c1b;
        --sh-mut: #5c645f;
        --sh-line: #c0c9c4;
        --sh-accent: #366758;
        --sh-accent-ink: #ffffff;
        --sh-accent-edge: #24463b;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 48px 20px;
        box-sizing: border-box;
        background: var(--sh-bg);
        color: var(--sh-ink);
        text-align: center;
        font-family: 'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', Roboto, sans-serif;
      }
      :root[data-theme='dark'] #seo-home {
        --sh-bg: #20262c;
        --sh-panel: #272e35;
        --sh-ink: #e8eae7;
        --sh-mut: #949e98;
        --sh-line: #404a52;
        --sh-accent: #5fb597;
        --sh-accent-ink: #0f1214;
        --sh-accent-edge: #3f7f69;
      }
      #seo-home .sh-eyebrow {
        margin: 0;
        font-family: 'Space Grotesk Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sh-accent);
      }
      #seo-home h1 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 2px 0 14px;
        font-size: clamp(44px, 7vw, 64px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      /* the app's presenting sponsor. TEXT, not the artwork: the logo files are
         bundled through Vite and come out fingerprinted, so this markup — which
         ships before any JS runs and is also what a crawler reads — has no stable
         path to point at, and an absolute `/sponsors/…` would 404 under the
         Electron build's `file://` base. The rendered home menu draws the real
         mark a beat later (src/ui/Sponsor.tsx). */
      #seo-home .sh-presents {
        margin: 0 0 22px;
        font-family: 'Space Grotesk Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--sh-mut);
      }
      #seo-home .sh-presents a {
        color: var(--sh-ink);
        text-decoration: none;
      }
      #seo-home .sh-menu {
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #seo-home .sh-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 15px 18px;
        border: 1px solid var(--sh-line);
        border-radius: 9999px;
        background: var(--sh-panel);
        color: var(--sh-ink);
        text-decoration: none;
        box-shadow: 0 3px 0 var(--sh-line);
      }
      #seo-home .sh-btn.primary {
        background: var(--sh-accent);
        color: var(--sh-accent-ink);
        border-color: transparent;
        box-shadow: 0 3px 0 var(--sh-accent-edge);
      }
      #seo-home .sh-btn b {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      #seo-home .sh-btn span {
        font-family: 'Space Grotesk Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        letter-spacing: 0.06em;
        opacity: 0.75;
      }
      /* the game switcher, which is a pair of real links here. Mirrors the
         segmented control the rendered home menu draws in the same slot. */
      #seo-home .sh-games {
        display: flex;
        gap: 6px;
        margin: 0 0 22px;
      }
      #seo-home .sh-games a {
        padding: 7px 14px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 700;
        color: var(--sh-mut);
        text-decoration: none;
      }
      #seo-home .sh-games a.on {
        background: var(--sh-accent);
        color: var(--sh-accent-ink);
      }
      #seo-home .sh-foot {
        margin: 26px 0 0;
        font-size: 13px;
        color: var(--sh-mut);
      }
      #seo-home .sh-foot a {
        color: var(--sh-mut);
        margin: 0 7px;
      }
      #seo-home .sh-load {
        display: none;
      }

      /* ── THE BOOT SCREEN (JS on) ─────────────────────────────────────────────
         Fixed over #root until `dismissBoot` fades it. The ground follows
         `data-boot`: the menu stage's (--ds-stage-bg and the on-field inks, dark
         in both themes) or the themed shell's (--ds-bg), so only the content
         changes when it leaves. */
      :root[data-boot] #seo-home {
        position: fixed;
        inset: 0;
        z-index: 10000;
        min-height: 0;
        padding: 24px;
      }
      :root[data-boot='stage'] #seo-home {
        --sh-bg: #14171c;
        --sh-ink: #f9faf7;
        --sh-mut: #b9beb8;
        --sh-accent: #5fb597;
      }
      :root[data-boot] #seo-home .sh-eyebrow,
      :root[data-boot] #seo-home .sh-games,
      :root[data-boot] #seo-home .sh-menu,
      :root[data-boot] #seo-home .sh-foot {
        display: none;
      }
      :root[data-boot] #seo-home h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, min(7vw, 7.5vh), 64px);
      }
      /* the 3D loading screen's bar (`.game-loading-bar`, styles.css): indeterminate, because
         nothing here knows a fraction. It shows only after 600 ms, so a fast load never draws it. */
      :root[data-boot] #seo-home .sh-load {
        display: block;
        position: relative;
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 9999px;
        box-shadow: inset 0 0 0 1px var(--sh-mut);
        opacity: 0;
        animation: sh-load-in 200ms ease-out 600ms both;
      }
      #seo-home .sh-load span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: var(--sh-accent);
        animation: sh-load-sweep 1.1s ease-in-out infinite;
      }
      @keyframes sh-load-in {
        to {
          opacity: 1;
        }
      }
      @keyframes sh-load-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* a sweep that stops is a bar that looks stuck, so it holds still, centred (as in a match) */
        #seo-home .sh-load span {
          animation: none;
          left: 30%;
        }
        :root[data-boot] #seo-home .sh-load {
          animation-duration: 0.01ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="seo-home">
      <p class="sh-eyebrow">FIRST Tech Challenge</p>
      <!-- the mark is `Logo.tsx` / public/favicon.svg, inline because nothing else has loaded;
           its gradient id differs from Logo's so the two never collide while both are up -->
      <h1>
        <svg width="52" height="52" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="shGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#8fdcc2" />
              <stop offset="1" stop-color="#366758" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="7" fill="url(#shGrad)" />
          <g stroke="#14332a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="10.5" width="18" height="14.5" rx="3.4" fill="none" />
            <line x1="16" y1="14.6" x2="16" y2="5.5" />
          </g>
          <circle cx="16" cy="17.7" r="3.1" fill="#14332a" />
        </svg>
        DSIM
      </h1>
      <!-- THIS IS THE LOADING SCREEN: what a visitor looks at while the bundle
           downloads and parses and the Rapier WASM decodes (main.tsx blocks the first
           render on both) — and what a non-JS client sees forever. The presenting
           sponsor belongs on it for exactly that reason, and it stays VISIBLE in the
           boot look. Keep it in step with `SponsorPresents`. -->
      <!-- ⚠️ THE HREF IS UTM-TAGGED BY HAND, and it has to be: this markup ships
           before any bundle runs, so it cannot call `sponsorLink('loading')` —
           but an untagged link is one Offset's own analytics files under "direct"
           and cannot attribute to us at all. The tag below IS `sponsorLink('loading')`
           spelled out, and the smoke lane compares the two strings so they cannot
           drift. It fires no event, for the same reason: there is no analytics
           script on the page yet. -->
      <!-- ⚠️ `target="_blank"` IS LOAD-BEARING, NOT POLISH. dsim also runs as a Discord
           Activity, inside a cross-origin iframe at `<app-id>.discordsays.com` whose CSP
           allows exactly two hosts (the two URL mappings). A bare anchor is a SAME-FRAME
           navigation: a participant who taps this — and it is on screen for the WHOLE cold
           boot, which on a phone with the BIOBUZZ default is the longest look anyone gets
           at this screen — navigates the activity frame itself at a host the embed may not
           load, and there is no back button in the embed to undo it. The three external
           links on this page therefore ALL open in a new context, the way every external
           link in the React tree already does (`Sponsor.tsx`, `HomeMenu.tsx`). This changes
           only HOW the link opens — the placement and its hand-written UTM tag below are a
           contracted obligation (docs/area/sponsor.md) and are untouched. -->
      <p class="sh-presents">
        Presented by
        <a
          href="https://offsetrobotics.com/?utm_source=dsim&amp;utm_medium=loading&amp;utm_campaign=biobuzz-2026"
          target="_blank"
          rel="noreferrer"
          >Offset Robotics</a
        >
      </p>
      <!-- The two games, as real links. Each is its own indexable page with its
           own title and description (see applyRouteMeta), and these are the only
           thing pointing a crawler at them. -->
      <nav class="sh-games" aria-label="Game">
        <a class="on" href="/decode">DECODE</a>
        <a href="/chain">Chain Reaction</a>
        <a href="/biobuzz">BIOBUZZ</a>
      </nav>
      <nav class="sh-menu" aria-label="Main">
        <a class="sh-btn primary" href="/decode/modes"><b>Play</b><span>Pick a game mode</span></a>
        <a class="sh-btn" href="/decode/configure/robot"
          ><b>Configure</b><span>Robot &amp; match setup</span></a
        >
        <a class="sh-btn" href="/decode/records"><b>Records</b><span>Leaderboard &amp; career</span></a>
        <a class="sh-btn" href="/decode/download"><b>Download</b><span>Desktop app</span></a>
      </nav>
      <p class="sh-foot">
        <a href="/decode/changelogs">Changes</a>
        <a href="/decode/contributors">Contributors</a>
        <!-- external, so same rule as the sponsor link above: never a same-frame
             navigation, because this markup is also the Discord Activity's boot screen -->
        <a href="https://github.com/genius0412/dsim" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://discord.gg/YB4tXnx7Pj" target="_blank" rel="noreferrer">Discord</a>
      </p>
      <!-- the boot look's loading bar; hidden on the no-JS page -->
      <div class="sh-load" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
