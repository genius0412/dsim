# PRIMARY ROUTER for the alpha preview (dsim-alpha). Same as router/fly.toml; idles to zero
# because the preview is used in bursts. Deploy with ./scripts/fly-deploy.sh --router --alpha.
#
# ord, not iad: the router lives in, and replays to, its game app's primary region, and
# dsim-alpha moved to ord on 2026-11-02 (fly.alpha.toml says what else moves with it).

app = 'dsim-alpha-primary'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  TARGET_APP = 'dsim-alpha'
  TARGET_REGION = 'ord'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_router/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
