# PRIMARY ROUTER for production (dohun-sim-decode). See router/primaryRouter.mjs and
# src/net/primaryHost.ts. Deploy with ./scripts/fly-deploy.sh --router, never a bare
# `fly deploy` from the repo root (that reads the GAME app's fly.toml).
#
# Its machines must only ever be in iad. A router machine in another region would sit nearest
# some players, start for their polls, and bring back the cost this exists to remove.

app = 'dsim-primary'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  TARGET_APP = 'dohun-sim-decode'
  TARGET_REGION = 'iad'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_router/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
