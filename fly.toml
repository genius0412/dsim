# fly.toml app configuration file generated for dohun-sim-decode on 2026-07-06T18:01:15-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dohun-sim-decode'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # LAN PLAY IS ON IN PRODUCTION (owner, 2026-09-13). Either flag makes the server advertise
  # the `lan` capability on /api/presence, which is what lights the client's LAN entry points,
  # so no Vercel change is needed (docs/lan-webrtc.md, "Which flag turns the LAN screen on").
  #   · LAN_UPLOADS mounts /api/lan: a self-hosted match filed by its signed-in host lands in
  #     `lan_runs`, which no board, record, rank or rating reads (server/lanUploads.ts).
  #   · LAN_SIGNALLING introduces two browsers so one can host the room in a TAB. It touches no
  #     data. Production sets NEON_AUTH_URL, so an anonymous host is still refused (`lanAnon`).
  LAN_UPLOADS = '1'
  LAN_SIGNALLING = '1'
  # MULTI-CORE ROOMS (server/roomHost.ts, docs/scaling-multicore.md). `auto` runs rooms on one
  # worker thread per vCPU beyond the first, which keeps the sockets: performance-1x (one vCPU)
  # runs rooms in-process exactly as before, iad's performance-2x gets one worker, jnb's
  # shared-cpu-4x three. `/api/perf` reports each worker. Rollback: '0' and redeploy.
  SIM_WORKERS = 'auto'

[http_service]
  internal_port = 8080
  force_https = true
  # auto-stop when idle: Fly bills $0 CPU/RAM for a stopped machine (only ~1¢/mo
  # rootfs), and auto_start wakes it on the next connection. Trade-off: the first
  # player of a session eats a cold boot (~7s tsx transpile + Fly wake). Practice
  # usage is bursty, so this idles to near-free vs. ~$3.32/mo always-on.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # keep ONE machine warm (the primary region = the designated MATCHMAKER_REGION):
  # ranked queueing fly-replays to it, so it must always be up. Other regions still
  # idle to zero and cold-boot on the first connection (auto_start).
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    # generous timeout + grace so the probe tolerates a cold boot (auto_start wakes
    # the machine on the first connection) without ever flapping the machine.
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

# DEDICATED CPU (the primary + high-traffic regions). The room loop runs a continuous
# 60 Hz Rapier physics step; on a burstable SHARED CPU that exhausts the burst credits
# within a minute, Fly then throttles the machine to its tiny baseline, the single-
# threaded event loop stalls, and even the trivial /health response blows past the probe
# timeout → the machine flaps "unhealthy" even with ONE player. A dedicated vCPU is never
# throttled, so the loop keeps real-time and /health always answers. auto_stop_machines=
# 'stop' means a region only runs while someone is connected, so idle cost stays ~0.
#
# COST DOWNGRADE (2026-07-09): this default applies to iad (always-warm matchmaker/primary
# = the dominant always-on bill) and sjc (US West). Dropped performance-2x/4GB →
# performance-1x/2GB: still ONE DEDICATED vCPU (no throttle-flap), half the cores + RAM.
# The 2nd core only ever bought GC/JIT headroom off the main thread (the sim loop is
# single-threaded), so a busy region may jitter slightly more under sustained multi-match
# load — acceptable for the traffic these see. Bump back to performance-2x if it stutters.
#
# COST PASS (2026-07-20): performance-1x/2048 → shared-cpu-4x/1024 on iad. MEASURED first
# (that is the only reason this is safe — the note above records a shared CPU flapping):
#   · one room's 60Hz step costs ~0.02 cores (1 robot) to ~0.03 (2v2) on fast hardware —
#     ~33-55 concurrent rooms per core. Idle draw is 0.01 cores; RSS is ~80MB.
#   · so the old flap was shared-cpu-**1x**, whose sustained baseline is a fraction of a
#     core ≈ ONE busy room. Fly's baseline scales with core count, so 4x has several times
#     the headroom at a fraction of a dedicated vCPU's price.
#   · memory could finally drop too: performance-* enforces a 2048MiB floor, shared does not.
# WATCH IT: `GET /api/perf` reports event-loop lag percentiles. If p99 climbs toward the
# 16.67ms step budget under real matches, go UP (shared-cpu-8x) or back to performance-1x —
# a throttled machine does not degrade gracefully, it stalls /health and flaps.
# EVERY other region runs shared-cpu-1x/1024MB via scripts/fly-deploy.sh — sjc joined the
# satellites in the same pass. `fly deploy` re-applies THIS block to every machine, which
# is why that script must always re-shrink them afterward.
# COST PASS (2026-09-06): nothing moves here, and BOTH halves are measured.
#
# CPU stays at 4x. `/api/perf` on the live primary with TWO rooms and 8 players read
# 0.244 cores, against a shared-cpu-4x sustained baseline of ~0.25 (4 × 6.25%). Two
# concurrent matches already sit ON the baseline and run on burst credits, with loop
# lag p99 at 11.4ms of the 16.67ms step budget. Down from here is the throttle-flap
# described above, not a saving. If concurrency grows, this goes UP.
#
# ⚠️ MEMORY CANNOT COME DOWN EITHER, and not for a reason you can see from the RSS.
# RSS is only 111MB under that same load, so 512 looked free — but Fly REFUSED it:
#   invalid config.guest.memory_mb, minimum required 1024 MiB
# A shared size carries a memory FLOOR equal to its default, so RAM is not an
# independent dial: 512 requires dropping to shared-cpu-2x, which the paragraph above
# rules out. The satellites are a different story — they run shared-cpu-1x, whose
# floor is 256, and scripts/fly-deploy.sh puts them on 512.
#
# LAUNCH SIZING (2026-09-13, BIOBUZZ + the alpha promotion): shared-cpu-4x/1024 →
# performance-2x/4096, on the owner's "safer than sorry", from docs/capacity.md:
#   · iad is the always-warm primary AND the matchmaker AND the presence heartbeat AND the
#     HTTP API, and US East is the biggest share of players. On a shared size the 60 Hz loop
#     rides burst credits past ~0.25 cores; two rooms already sat on that line (2026-09-06).
#   · the FIRST dedicated core is what adds rooms (~8-10 driven, never throttled).
#   · the SECOND buys headroom off the loop's core for GC/JIT and for permessage-deflate, which
#     runs on the libuv threadpool for every socket on the machine. Past this size the answer
#     is SIM_WORKERS (docs/scaling-multicore.md), not a bigger VM: one process is one core.
#   · performance-* floors memory at 2048MB per core, so 4096 is the floor, not a choice.
# This block is applied to EVERY machine by `fly deploy`; scripts/fly-deploy.sh then puts each
# satellite back on its own size. Never a bare `fly deploy`.
[[vm]]
  size = 'performance-2x'
  memory = '4096mb'
